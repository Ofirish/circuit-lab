<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מעבדת מעגלים – Circuit Lab</title>
<style>
:root{--bg:#06090e;--panel:#0d131b;--panel2:#111a24;--line:#1e2937;--line2:#2d3d52;--text:#e8eef6;--muted:#8b9aad;--cyan:#38d1ff;--gold:#ffb020;--green:#3ddc84;--red:#ff5a36;--blue:#4f8cff;--violet:#c4b5fd;
--sans:"Segoe UI","Rubik","Heebo","Assistant",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono","Cascadia Mono","Consolas","SF Mono","Menlo",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans)}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
header h1{font-size:15px;margin:0;white-space:nowrap;font-weight:600}
header h1 b{color:var(--cyan)}
.tb{display:flex;gap:6px;align-items:center;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px 0}
.tb::-webkit-scrollbar{display:none}
button{font:inherit;font-size:13px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap;min-height:34px;flex:none}
button:hover{border-color:var(--line2)}
button.on{background:#0d2636;border-color:var(--cyan);color:var(--cyan)}
button.pri{background:#0d2636;border-color:#1f5f7a}
button:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:22px;background:var(--line);flex:none}
main{flex:1;display:flex;min-height:0}
#pal{width:96px;flex:none;border-inline-end:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.pi{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 3px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:11px;color:var(--muted);flex:none}
.pi svg{width:60px;height:34px;overflow:visible}
.pi:hover{border-color:var(--cyan);color:var(--text)}
#stage{flex:1;position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;direction:ltr}
#status{position:absolute;inset-inline:8px;bottom:8px;display:flex;gap:6px;align-items:flex-end;pointer-events:none}
#hint{flex:1;font-size:12px;color:var(--muted);background:rgba(13,19,27,.85);border:1px solid var(--line);border-radius:8px;padding:5px 9px;pointer-events:none}
#hint:empty{display:none}
.zb{pointer-events:auto;display:flex;gap:4px}
.zb button{min-width:34px;padding:4px 8px;background:rgba(17,26,36,.9)}
#badge{pointer-events:auto}
#side{width:360px;flex:none;border-inline-start:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;border:0;border-radius:0;background:none;border-bottom:2px solid transparent;min-height:40px}
.tabs button.on{border-bottom-color:var(--cyan);background:none}
#sideMin{display:none;flex:none;max-width:44px}
.pane{flex:1;overflow:auto;padding:12px;font-size:14px;line-height:1.5}
.pane h3{margin:0 0 8px;font-size:15px}
.pane h4{margin:14px 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.fld{display:grid;grid-template-columns:90px 1fr 34px;gap:6px;align-items:center;margin-bottom:8px}
.fld label{font-size:13px;color:var(--muted)}
.fld input{font:inherit;font-family:var(--mono);font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;direction:ltr;text-align:left}
.fld input:focus{outline:none;border-color:var(--cyan)}
.fld input.bad{border-color:var(--red)}
.fld span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.kv div:nth-child(even),.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;text-align:start}
.kv div:nth-child(even){text-align:end}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:600}
td.num{text-align:end;white-space:nowrap}
.msg{border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:13px}
.msg.err{background:rgba(255,90,54,.12);border:1px solid rgba(255,90,54,.5)}
.msg.warn{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.45)}
.msg.ok{background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.4)}
pre.calc{font-family:var(--mono);font-size:12px;white-space:pre-wrap;unicode-bidi:plaintext;text-align:start;margin:0;line-height:1.55;color:#cfd8e3}
.help li{margin-bottom:5px;color:#c9d3df}
.help b{color:var(--cyan);font-weight:600}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:220px}
.menu button{border:0;background:none;text-align:start;width:100%}
.menu button:hover{background:var(--panel2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0d2636;border:1px solid var(--cyan);color:var(--text);padding:8px 14px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#ghost{position:fixed;pointer-events:none;z-index:70;display:none;width:60px;height:34px;opacity:.85}
#print{display:none}
button.play{background:#0f3a24;border-color:#2f8f5b;color:#7ef0b0;font-weight:600}
button.play.on{background:#3a1410;border-color:#ff5a36;color:#ffb4a3}
.pill{font-size:12px;border-radius:20px;padding:3px 10px;border:1px solid var(--line)}
.pill.err{color:#ff8a6a;border-color:rgba(255,90,54,.5)}.pill.warn{color:var(--gold);border-color:rgba(255,176,32,.45)}.pill.info{color:var(--cyan)}
.dcard{border:1px solid var(--line);border-inline-start:4px solid var(--muted);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel2)}
.dcard.err{border-inline-start-color:var(--red)}.dcard.warn{border-inline-start-color:var(--gold)}.dcard.info{border-inline-start-color:var(--cyan)}
.dcard.foc{box-shadow:0 0 0 1px var(--cyan)}
.dt{font-weight:600;margin-bottom:6px}
.dh{font-size:12px;color:var(--cyan);margin:8px 0 2px;font-weight:600}
.dw{font-size:13px;color:#c9d3df}
.dcard ol{margin:2px 0 0;padding-inline-start:20px;font-size:13px;color:#c9d3df}
.dcard ol li{margin-bottom:3px}
.dloc{font-size:12px;min-height:28px;padding:3px 8px}
table.et td{vertical-align:top}
table.et tr.rsel td{background:rgba(56,209,255,.07)}
table.et tr.rerr td:first-child{box-shadow:inset -3px 0 0 var(--red)}
table.et tr.rwarn td:first-child{box-shadow:inset -3px 0 0 var(--gold)}
.ti{font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;direction:ltr;text-align:left}
.ti:focus{outline:none;border-color:var(--cyan)}.ti.bad{border-color:var(--red)}
.ti.tn{font-family:var(--sans);font-weight:600;width:72px}
.tt{font-size:11px;color:var(--muted);margin-top:2px}
.tl{display:block;margin-bottom:4px}.tk{display:block;font-size:11px;color:var(--muted)}
.tv{display:flex;gap:4px;align-items:center}.tv i{font-style:normal;font-size:11px;color:var(--muted);font-family:var(--mono);min-width:12px}
.flow{stroke:#ffd166;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:0.1 14;fill:none;animation:fl 1.5s linear infinite;pointer-events:none}
.flow.fp{stroke:#ffe8a3;opacity:.85}
@keyframes fl{to{stroke-dashoffset:-14.1}}
.glow .sym{stroke:#ff6b5a;filter:drop-shadow(0 0 3px #ff3b30) drop-shadow(0 0 9px #ff3b30);animation:gp .8s ease-in-out infinite alternate}
.glow .lbl{fill:#ff8a7a}
@keyframes gp{from{filter:drop-shadow(0 0 2px #ff3b30) drop-shadow(0 0 4px #ff3b30)}to{filter:drop-shadow(0 0 5px #ff3b30) drop-shadow(0 0 14px #ff3b30)}}
/* schematic styles (screen) */
.wire{stroke:#5fb8e6;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire.sel{stroke:var(--gold);stroke-width:3}
.sym{stroke:#e8eef6;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sym .fillc{fill:#0d131b}
.psel .sym{stroke:var(--gold)}
.sym text,.symt{fill:#e8eef6;stroke:none;font:600 12px var(--sans)}
.psel .symt{fill:var(--gold)}
.jn{fill:#5fb8e6}
.pin{fill:#8b9aad}
.pin.dang{fill:var(--red)}
.lbl{fill:#c4b5fd;font:600 12px var(--sans)}
.res{fill:#3ddc84;font:500 11px var(--mono)}
.res.w{fill:var(--gold)}
.ntag rect{fill:#0d2636;stroke:#1f5f7a}
.ntag text{fill:#38d1ff;font:500 10.5px var(--mono)}
.hit{fill:transparent;stroke:transparent}
.whit{stroke:transparent;stroke-width:16;fill:none}
.prev{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4;fill:none}
.cur{fill:none;stroke:var(--gold);stroke-width:1.5}
.dropseg{stroke:var(--gold);stroke-width:5;opacity:.6;fill:none}
@media (max-width:820px){
 header h1{display:none}
 main{flex-direction:column}
 #pal{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border:0;border-bottom:1px solid var(--line);padding:5px}
 .pi{width:68px}
 #side{width:auto;height:40%;border:0;border-top:1px solid var(--line)}
 #side.min{height:41px}
 #side.min .pane{display:none}
 #sideMin{display:block}
}
@media print{
 body{display:block;height:auto;overflow:visible;background:#fff;color:#000}
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000;font-family:Arial,sans-serif}
 #print svg{max-width:100%;height:auto}
 #print table{font-size:11px}
 #print th,#print td{border-bottom:1px solid #bbb;color:#000}
 #print pre{white-space:pre-wrap;font-size:10.5px;unicode-bidi:plaintext}
}
</style>
</head>
<body>
<header>
 <h1>⚡ <b>מעבדת</b> מעגלים</h1>
 <div class="tb" id="tb">
  <button id="bPlay" class="play"></button>
  <button id="bSel" class="on"></button>
  <button id="bWire"></button>
  <span class="sep"></span>
  <button id="bRot"></button>
  <button id="bDel"></button>
  <button id="bUndo">↶</button>
  <button id="bRedo">↷</button>
  <span class="sep"></span>
  <button id="bEx"></button>
  <button id="bNew"></button>
  <button id="bTidy"></button>
  <button id="bExp" class="pri"></button>
  <button id="bVals" class="on"></button>
  <button id="bBlocks" style="border-style:dashed;color:#c4b5fd"></button>
  <button id="bLang">EN</button>
 </div>
</header>
<main>
 <div id="pal"></div>
 <div id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg">
   <defs><pattern id="gp" x="-10" y="-10" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.1" fill="#223042"/></pattern></defs>
   <g id="view"><rect x="-20000" y="-20000" width="40000" height="40000" fill="url(#gp)"/><g id="sch"></g><g id="ov"></g></g>
  </svg>
  <div id="status"><div id="hint"></div><div class="zb"><button id="badge" style="display:none"></button><button id="zOut">−</button><button id="zFit">⤢</button><button id="zIn">+</button></div></div>
 </div>
 <aside id="side">
  <div class="tabs"><button data-tab="part" class="on"></button><button data-tab="tbl"></button><button data-tab="diag"></button><button data-tab="res"></button><button data-tab="calc"></button><button id="sideMin">▾</button></div>
  <div class="pane" id="pane"></div>
 </aside>
</main>
<div id="toast"></div>
<svg id="ghost" viewBox="-50 -30 100 60"></svg>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">
<div id="print"></div>
<script>
"use strict";
/* ================= ENGINE (pure) ================= */
const GRID=20;
const TYPES={
 R:{pfx:'R',pins:[[-40,0],[40,0]],box:[40,10],props:[['R','10k','Ω'],['Pmax','0.25','W']],line:true},
 V:{pfx:'V',pins:[[0,-40],[0,40]],box:[18,40],props:[['V','5','V']],line:true,vert:true},
 I:{pfx:'I',pins:[[0,-40],[0,40]],box:[18,40],props:[['I','1m','A']],line:true,vert:true},
 G:{pfx:'GND',pins:[[0,0]],box:[12,22],props:[]},
 OA:{pfx:'U',pins:[[-40,-20],[-40,20],[40,0]],box:[40,32],props:[['A','1e6',''],['Vsat','13','V'],['Imax','25m','A']]},
 C:{pfx:'C',pins:[[-40,0],[40,0]],box:[40,14],props:[['C','1u','F'],['Vmax','50','V']],line:true},
 L:{pfx:'L',pins:[[-40,0],[40,0]],box:[40,10],props:[['L','1m','H'],['Irated','1','A']],line:true},
 AM:{pfx:'AM',pins:[[-40,0],[40,0]],box:[40,14],props:[],line:true},
 VM:{pfx:'VM',pins:[[-40,0],[40,0]],box:[40,14],props:[],line:true},
};
const SI={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,'μ':1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9};
function parseVal(s){
 if(typeof s==='number')return s;
 s=String(s==null?'':s).trim().replace(',','.');
 const m=s.match(/^([-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?)\s*(meg|MEG|Meg|[pnuµμmkKMG])?/);
 if(!m)return NaN;
 let v=parseFloat(m[1]);
 if(m[2])v*=/meg/i.test(m[2])?1e6:SI[m[2]];
 return v;
}
function eng(v,u,d){
 u=u||'';d=d||4;
 if(v==null||!isFinite(v))return '—';
 if(Math.abs(v)<1e-13)return '0 '+u;
 const pf=[[1e9,'G'],[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
 const a=Math.abs(v);
 const p=pf.find(q=>a>=q[0]*0.99995)||pf[pf.length-1];
 let s=(v/p[0]).toPrecision(d);
 if(/e/.test(s))s=String(+s);else if(s.indexOf('.')>=0)s=s.replace(/\.?0+$/,'');
 return s+' '+p[1]+u;
}
function rp(x,y,r){r=((r%4)+4)%4;for(let i=0;i<r;i++){const t=x;x=-y;y=t;}return [x,y];}
function pinsAbs(p){return TYPES[p.type].pins.map(([x,y])=>{const q=rp(x,y,p.rot||0);return [p.x+q[0],p.y+q[1]];});}
const K=(x,y)=>x+','+y;
function onSegInt(x,y,s){ // strictly inside segment
 const [x1,y1,x2,y2]=s;
 if((x2-x1)*(y-y1)-(y2-y1)*(x-x1)!==0)return false;
 const d=(x-x1)*(x2-x1)+(y-y1)*(y2-y1),L=(x2-x1)**2+(y2-y1)**2;
 return d>0&&d<L;
}
function buildNets(st){
 const par={};
 const add=k=>{if(!(k in par))par[k]=k;};
 const f=k=>{while(par[k]!==k){par[k]=par[par[k]];k=par[k];}return k;};
 const un=(a,b)=>{add(a);add(b);a=f(a);b=f(b);if(a!==b)par[a]=b;};
 const pts=[],segs=[],deg={};
 const inc=(k,n)=>{deg[k]=(deg[k]||0)+n;};
 st.parts.forEach(p=>pinsAbs(p).forEach(([x,y],i)=>{const k=K(x,y);add(k);pts.push({k,x,y,pin:[p.id,i]});inc(k,1);}));
 st.wires.forEach(w=>{for(let i=0;i<w.pts.length;i++){const [x,y]=w.pts[i];const k=K(x,y);add(k);pts.push({k,x,y,w:w.id});
   if(i>0){const [x0,y0]=w.pts[i-1];un(K(x0,y0),k);segs.push([x0,y0,x,y]);inc(K(x0,y0),1);inc(k,1);}}});
 const uniq={};pts.forEach(q=>{uniq[q.k]=q;});
 const uq=Object.values(uniq);
 for(const s of segs)for(const q of uq)if(onSegInt(q.x,q.y,s)){un(q.k,K(s[0],s[1]));inc(q.k,2);}
 const gr=new Set();
 st.parts.forEach(p=>{if(p.type==='G'){const [x,y]=pinsAbs(p)[0];gr.add(f(K(x,y)));}});
 const nodeOfRoot={},nodes=[{name:'GND'}];let n=0;
 for(const q of pts){const r=f(q.k);if(r in nodeOfRoot)continue;if(gr.has(r)){nodeOfRoot[r]=0;continue;}n++;nodeOfRoot[r]=n;nodes.push({name:'N'+n,x:q.x,y:q.y,wire:false});}
 for(const q of pts){if(q.w){const id=nodeOfRoot[f(q.k)];if(id>0&&!nodes[id].wire){nodes[id].x=q.x;nodes[id].y=q.y;nodes[id].wire=true;}}}
 const pinCount={};
 st.parts.forEach(p=>pinsAbs(p).forEach(([x,y])=>{const r=f(K(x,y));pinCount[r]=(pinCount[r]||0)+1;}));
 const partNodes={},partRoots={},dangling=[];
 st.parts.forEach(p=>{partRoots[p.id]=[];partNodes[p.id]=pinsAbs(p).map(([x,y])=>{const r=f(K(x,y));partRoots[p.id].push(r);if(pinCount[r]<2&&p.type!=='G'&&!gr.has(r))dangling.push([x,y]);return nodeOfRoot[r];});});
 const junctions=Object.keys(deg).filter(k=>deg[k]>=3).map(k=>k.split(',').map(Number));
 const nodeAt=(x,y)=>{const k=K(x,y);return (k in par)?nodeOfRoot[f(k)]:-1;};
 return {nodes,partNodes,partRoots,dangling,junctions,nodeAt,deg,hasGround:gr.size>0};
}
function gauss(A,b){
 const n=b.length,M=A.map((r,i)=>{const a=Array.from(r);a.push(b[i]);return a;});
 for(let c=0;c<n;c++){
  let p=c,mx=Math.abs(M[c][c]);
  for(let r=c+1;r<n;r++){const v=Math.abs(M[r][c]);if(v>mx){mx=v;p=r;}}
  if(mx<1e-15)return null;
  if(p!==c){const t=M[c];M[c]=M[p];M[p]=t;}
  for(let r=c+1;r<n;r++){const fct=M[r][c]/M[c][c];if(fct)for(let k=c;k<=n;k++)M[r][k]-=fct*M[c][k];}
 }
 const x=new Array(n);
 for(let r=n-1;r>=0;r--){let s=M[r][n];for(let k=r+1;k<n;k++)s-=M[r][k]*x[k];x[r]=s/M[r][r];}
 return x;
}
const VSRC={V:1,L:1,AM:1,OA:1};
function solve(st){
 const net=buildNets(st),N=net.nodes.length-1,parts=st.parts;
 const out={net,errs:[],warns:[],ok:false,res:{},nodeV:[0],pinI:{}};
 if(!parts.length){out.empty=true;return out;}
 if(net.dangling.length)out.warns.push({k:'dang',n:net.dangling.length});
 if(!net.hasGround){out.errs.push({k:'noGround'});return out;}
 const val={};
 for(const p of parts){val[p.id]={};for(const [k] of TYPES[p.type].props){const v=parseVal(p.props[k]);
   if(!isFinite(v)||((k==='R'||k==='Vsat'||k==='A')&&v<=0))out.errs.push({k:'badVal',p:p.name,prop:k});val[p.id][k]=v;}}
 if(out.errs.length)return out;
 const br=parts.filter(p=>VSRC[p.type]),bi={};
 br.forEach((p,i)=>bi[p.id]=N+i);
 const M=N+br.length,oas=parts.filter(p=>p.type==='OA'),sat={};
 oas.forEach(p=>sat[p.id]=0);
 let x=null,conv=false;
 for(let it=0;it<40;it++){
  const A=Array.from({length:M},()=>new Float64Array(M)),z=new Float64Array(M);
  for(let i=0;i<N;i++)A[i][i]+=1e-12;
  const g=(a,b,G)=>{if(a>0)A[a-1][a-1]+=G;if(b>0)A[b-1][b-1]+=G;if(a>0&&b>0){A[a-1][b-1]-=G;A[b-1][a-1]-=G;}};
  for(const p of parts){const nd=net.partNodes[p.id],v=val[p.id];
   if(p.type==='R')g(nd[0],nd[1],1/v.R);
   else if(p.type==='I'){if(nd[0]>0)z[nd[0]-1]+=v.I;if(nd[1]>0)z[nd[1]-1]-=v.I;}
   else if(p.type==='V'||p.type==='L'||p.type==='AM'){const k=bi[p.id],a=nd[0],b=nd[1];
    if(a>0){A[a-1][k]+=1;A[k][a-1]+=1;}if(b>0){A[b-1][k]-=1;A[k][b-1]-=1;}z[k]=p.type==='V'?v.V:0;}
   else if(p.type==='OA'){const k=bi[p.id],nm=nd[0],np=nd[1],no=nd[2];
    if(no>0){A[no-1][k]+=1;A[k][no-1]+=1;}
    if(sat[p.id]===0){if(np>0)A[k][np-1]-=v.A;if(nm>0)A[k][nm-1]+=v.A;z[k]=0;}
    else{if(no>0){z[k]=sat[p.id]*v.Vsat;}else{A[k][k]=1;}}
   }
  }
  x=gauss(A,z);
  if(!x){out.errs.push({k:'singular'});return out;}
  let ch=false;
  for(const p of oas){const nd=net.partNodes[p.id],V=n=>n>0?x[n-1]:0,lin=val[p.id].A*(V(nd[1])-V(nd[0])),vs=val[p.id].Vsat;
   const s=lin>vs*(1+1e-9)?1:lin<-vs*(1+1e-9)?-1:0;if(s!==sat[p.id]){sat[p.id]=s;ch=true;}}
  if(!ch){conv=true;break;}
 }
 if(!conv)out.warns.push({k:'noConv'});
 // currents below ~1nA are numerical leakage from the 1e-12 S stabilizer — show them as 0
 for(let i=N;i<M;i++)if(Math.abs(x[i])<1e-9)x[i]=0;
 const V=n=>n>0?x[n-1]:0;
 for(let i=0;i<=N;i++)out.nodeV[i]=V(i);
 for(let i=1;i<=N;i++)if(Math.abs(out.nodeV[i])>1e6)out.warns.push({k:'float',node:net.nodes[i].name});
 let Pdel=0,Pabs=0;
 for(const p of parts){const nd=net.partNodes[p.id],v=val[p.id],r={type:p.type};
  const Va=V(nd[0]),Vb=nd.length>1?V(nd[1]):0;
  r.Va=Va;r.Vb=Vb;r.vals=v;let pin=[];
  switch(p.type){
   case 'R':r.V=Va-Vb;r.I=r.V/v.R;if(Math.abs(r.I)<1e-9)r.I=0;r.P=r.I*r.I*v.R;Pabs+=r.P;pin=[r.I,-r.I];
    if(isFinite(v.Pmax)&&v.Pmax>0&&r.P>v.Pmax){r.over=true;out.warns.push({k:'pmax',p:p.name,P:r.P,Pmax:v.Pmax});}break;
   case 'V':{const i=x[bi[p.id]];r.I=-i;r.P=v.V*r.I;Pdel+=r.P;pin=[i,-i];break;}
   case 'L':case 'AM':{const i=x[bi[p.id]];r.I=i;r.V=Va-Vb;pin=[i,-i];if(p.type==='L'){r.E=0.5*v.L*i*i;if(isFinite(v.Irated)&&v.Irated>0&&Math.abs(i)>v.Irated){r.over=true;out.warns.push({k:'li',p:p.name,I:i,Ir:v.Irated});}}break;}
   case 'I':r.V=Va-Vb;r.I=v.I;r.P=r.V*v.I;Pdel+=r.P;pin=[-v.I,v.I];break;
   case 'C':r.V=Va-Vb;r.Q=v.C*r.V;r.E=0.5*v.C*r.V*r.V;pin=[0,0];if(isFinite(v.Vmax)&&v.Vmax>0&&Math.abs(r.V)>v.Vmax){r.over=true;out.warns.push({k:'cv',p:p.name,V:r.V,Vmax:v.Vmax});}break;
   case 'VM':r.V=Va-Vb;pin=[0,0];break;
   case 'OA':{const i=x[bi[p.id]];r.Vm=V(nd[0]);r.Vp=V(nd[1]);r.Vout=V(nd[2]);r.Vd=r.Vp-r.Vm;r.Iout=-i;r.P=r.Vout*r.Iout;Pdel+=r.P;r.sat=sat[p.id];pin=[0,0,i];
    if(r.sat)out.warns.push({k:'sat',p:p.name,s:r.sat,Vsat:v.Vsat});
    if(isFinite(v.Imax)&&v.Imax>0&&Math.abs(r.Iout)>v.Imax)out.warns.push({k:'imax',p:p.name,I:r.Iout,Imax:v.Imax});break;}
   case 'G':pin=[0];break;
  }
  r.nodes=nd;out.res[p.id]=r;out.pinI[p.id]=pin;
 }
 out.Pdel=Pdel;out.Pabs=Pabs;out.ok=true;
 return out;
}

function partCalc(p){
 if(!R||!R.ok)return [];const r=R.res[p.id];if(!r)return [];const v=r.vals,o=[];
 switch(p.type){
  case 'R':
   o.push(`${p.name} = ${eng(v.R,'Ω')}   [${nn(r.nodes[0])} → ${nn(r.nodes[1])}]`);
   o.push(`  I = (${vn(r.nodes[0])} − ${vn(r.nodes[1])}) / R = (${eng(r.Va,'V')} − ${eng(r.Vb,'V')}) / ${eng(v.R,'Ω')} = ${eng(r.I,'A')}`);
   o.push(`  P = I²·R = (${eng(r.I,'A')})² · ${eng(v.R,'Ω')} = ${eng(r.P,'W')}`+(isFinite(v.Pmax)&&v.Pmax>0?(r.over?L(`   ⚠ מעל ${eng(v.Pmax,'W')}!`,`   ⚠ above ${eng(v.Pmax,'W')}!`):L(`   ✓ מתחת ל-${eng(v.Pmax,'W')}`,`   ✓ below ${eng(v.Pmax,'W')}`)):''));
   break;

   o.push(L(`  הספק מסופק: P = V·I = ${eng(v.V,'V')} · ${eng(r.I,'A')} = ${eng(r.P,'W')}`,`  Power delivered: P = V·I = ${eng(v.V,'V')} · ${eng(r.I,'A')} = ${eng(r.P,'W')}`));
   break;
  case 'I':
   o.push(`${p.name} = ${eng(v.I,'A')}   [${L('יוצא אל','out to')} ${nn(r.nodes[0])}]`);
   o.push(`  V = ${vn(r.nodes[0])} − ${vn(r.nodes[1])} = ${eng(r.V,'V')}`);
   o.push(L(`  הספק מסופק: P = V·I = ${eng(r.P,'W')}`,`  Power delivered: P = V·I = ${eng(r.P,'W')}`));
   break;
  case 'OA':
   o.push(`${p.name} ${L('מגבר שרת','op-amp')}  (A = ${eng(v.A,'',3)}, ±${eng(v.Vsat,'V')})`);
   o.push(`  V+ = ${vn(r.nodes[1])} = ${eng(r.Vp,'V')},   V− = ${vn(r.nodes[0])} = ${eng(r.Vm,'V')}`);
   o.push(`  Vd = V+ − V− = ${eng(r.Vd,'V')}`);
   if(r.sat)o.push(L(`  A·Vd = ${eng(v.A*r.Vd,'V')} → מעבר לטווח, המוצא נתקע ב-${eng(r.Vout,'V')} ⚠`,`  A·Vd = ${eng(v.A*r.Vd,'V')} → out of range, output stuck at ${eng(r.Vout,'V')} ⚠`));
   else{o.push(`  Vout = A·Vd = ${eng(r.Vout,'V')}   ✓ ${L('בטווח','in range')}`);o.push(L(`  (קצר מדומה: V+ ≈ V− כי A גדול מאוד)`,`  (virtual short: V+ ≈ V− because A is huge)`));}
   o.push(L(`  זרם מוצא: Iout = ${eng(r.Iout,'A')},  P = Vout·Iout = ${eng(r.P,'W')}`,`  Output current: Iout = ${eng(r.Iout,'A')},  P = Vout·Iout = ${eng(r.P,'W')}`));
   break;
  case 'C':
   o.push(`${p.name} = ${eng(v.C,'F')}   ${L('(ב-DC: נתק)','(open in DC)')}`);
   o.push(`  V = ${eng(r.V,'V')},  Q = C·V = ${eng(r.Q,'C')},  E = ½·C·V² = ${eng(r.E,'J')}`);break;
  case 'L':
   o.push(`${p.name} = ${eng(v.L,'H')}   ${L('(ב-DC: קצר)','(short in DC)')}`);

  case 'VM':o.push(`${p.name}: V = ${vn(r.nodes[0])} − ${vn(r.nodes[1])} = ${eng(r.Va,'V')} − ${eng(r.Vb,'V')} = ${eng(r.V,'V')}`);break;
 }

  o.push(`  ${R.net.nodes[i].name}: `+t.map(([n,v],j)=>(v<0?'− ':(j?'+ ':''))+eng(Math.abs(v),'A',3)+` (${n})`).join(' ')+` = ${eng(Math.abs(s)<1e-9?0:s,'A')} ${Math.abs(s)<1e-9?'✓':''}`);}
 o.push('');o.push(L('מאזן הספקים:','Power balance:'));

 o.push(L(`  נצרך בנגדים: ${eng(R.Pabs,'W')}`,`  Dissipated in resistors: ${eng(R.Pabs,'W')}`));

function delSel(){
 if(!sel)return;snapshot();
 if(sel.kind==='part')st.parts=st.parts.filter(p=>p.id!==sel.id);else st.wires=st.wires.filter(w=>w.id!==sel.id);

}
function rotSel(){
 if(!sel||sel.kind!=='part')return;const p=getPart(sel.id);if(!p)return;snapshot();
 const pins0=pinsAbs(p);p.rot=((p.rot||0)+1)%4;rubber(p,pins0,origWires());changed();
}
function dupSel(){
 if(!sel||sel.kind!=='part')return;const p=getPart(sel.id);snapshot();
 const q=mkPart(p.type,p.x+40,p.y+60,p.rot,Object.assign({},p.props));st.parts.push(q);sel={kind:'part',id:q.id};changed();
}
function route(a,b){if(a[0]===b[0]||a[1]===b[1])return [a.slice(),b.slice()];return [a.slice(),[b[0],a[1]],b.slice()];}
function origWires(){const o={};st.wires.forEach(w=>o[w.id]=w.pts.map(q=>q.slice()));return o;}
// move wire ends that were attached to the part's old pins
function rubber(p,pins0,orig){
 const pins1=pinsAbs(p);
 for(const w of st.wires){
  const op=orig[w.id];if(!op)continue;
  const refs=[];
  [0,op.length-1].forEach(end=>{pins0.forEach((pp,i)=>{if(op[end][0]===pp[0]&&op[end][1]===pp[1]&&!refs.some(r=>r.end===end))refs.push({end,i});});});
  if(!refs.length)continue;
  if(op.length===2&&refs.length===1&&(op[0][0]===op[1][0]&&op[0][1]===op[1][1]))continue;
  let pts=op.map(q=>q.slice());
  const horiz0=op.length>=2&&op[0][1]===op[1][1];
  for(const rf of refs){
   const old=op[rf.end],nw=pins1[rf.i];pts[rf.end]=nw.slice();
   if(op.length>=3){const ni=rf.end===0?1:op.length-2;const nb=op[ni];
    if(nb[1]===old[1]&&nb[0]!==old[0])pts[ni][1]=nw[1];else if(nb[0]===old[0])pts[ni][0]=nw[0];}
  }
  if(pts.length===2&&pts[0][0]!==pts[1][0]&&pts[0][1]!==pts[1][1]){
   // keep orientation from the fixed end
   const fixedEnd=refs.length===1?(refs[0].end===0?1:0):0;
   const a=pts[fixedEnd],b=pts[1-fixedEnd];
   const c=horiz0?[b[0],a[1]]:[a[0],b[1]];
   pts=fixedEnd===0?[a,c,b]:[b,c,a];
  }
  // drop consecutive duplicates
  w.pts=pts.filter((q,i)=>i===0||q[0]!==pts[i-1][0]||q[1]!==pts[i-1][1]);
  if(w.pts.length<2)w.pts=[pts[0],pts[0].slice()];
 }
}
/* ----- insert a two-terminal part into a wire, spacing parts on that line ----- */
function findSegNear(wx,wy,tol){

 for(const w of st.wires)for(let i=1;i<w.pts.length;i++){
  const [x1,y1]=w.pts[i-1],[x2,y2]=w.pts[i];
  if(x1!==x2&&y1!==y2)continue;
  const len2=(x2-x1)**2+(y2-y1)**2;if(!len2)continue;
  let t=((wx-x1)*(x2-x1)+(wy-y1)*(y2-y1))/len2;if(t<0||t>1)continue;
  const px=x1+t*(x2-x1),py=y1+t*(y2-y1),d=Math.hypot(wx-px,wy-py);
  if(d<=tol&&(!best||d<best.d))best={w:w.id,i,d,px,py,seg:[x1,y1,x2,y2]};

 // also allow dropping onto a two-terminal part that sits on a straight line
 for(const p of st.parts){const ps=pinsAbs(p);if(ps.length!==2||!TYPES[p.type].line)continue;
  const [[x1,y1],[x2,y2]]=ps;const len2=(x2-x1)**2+(y2-y1)**2;
  let t=((wx-x1)*(x2-x1)+(wy-y1)*(y2-y1))/len2;if(t<0||t>1)continue;
  const px=x1+t*(x2-x1),py=y1+t*(y2-y1),d=Math.hypot(wx-px,wy-py);
  if(d<=tol+10&&(!best||d<best.d))best={part:p.id,d,px,py,seg:[x1,y1,x2,y2]};}

}
function insertIntoWire(type,hit){

 const ax=hor?0:1,fix=hor?y1:x1; // ax: coordinate index varying along line
 const on=pt=>pt[1-ax]===fix;
 // explode wires that touch this line into single segments
 const nw=[];
 for(const w of st.wires){
  const touches=w.pts.some((q,i)=>i>0&&on(q)&&on(w.pts[i-1]));
  if(!touches||w.pts.length===2){nw.push(w);continue;}
  for(let i=1;i<w.pts.length;i++)nw.push({id:nid('w'),pts:[w.pts[i-1].slice(),w.pts[i].slice()]});
 }
 st.wires=nw;
 // line items
 const items=[];
 for(const w of st.wires){if(w.pts.length!==2)continue;const [a,b]=w.pts;if(on(a)&&on(b)&&(a[0]!==b[0]||a[1]!==b[1])){const t1=Math.min(a[ax],b[ax]),t2=Math.max(a[ax],b[ax]);items.push({kind:'w',id:w.id,t1,t2});}}
 for(const p of st.parts){const ps=pinsAbs(p);if(ps.length===2&&on(ps[0])&&on(ps[1])){const t1=Math.min(ps[0][ax],ps[1][ax]),t2=Math.max(ps[0][ax],ps[1][ax]);if(t2>t1)items.push({kind:'p',id:p.id,t1,t2});}}
 const net=buildNets(st);
 const ptKey=t=>hor?K(t,fix):K(fix,t);
 const tHit=hor?hit.px:hit.py;
 let start=items.find(it=>it.kind==='w'&&it.t1<=tHit&&it.t2>=tHit)||items.find(it=>it.t1<=tHit&&it.t2>=tHit);
 if(!start)return false;
 const run=[start];
 const conn=t=>net.deg[ptKey(t)]||0;
 // extend low
 let cur=start;
 for(;;){const t=cur.t1;if(conn(t)!==2)break;const nx=items.find(it=>it!==cur&&it.t2===t&&!run.includes(it));if(!nx)break;run.unshift(nx);cur=nx;}
 cur=start;
 for(;;){const t=cur.t2;if(conn(t)!==2)break;const nx=items.find(it=>it!==cur&&it.t1===t&&!run.includes(it));if(!nx)break;run.push(nx);cur=nx;}
 while(run.length&&run[0].kind==='p')run.shift();
 while(run.length&&run[run.length-1].kind==='p')run.pop();
 if(!run.length)return false;
 const A=run[0].t1,B=run[run.length-1].t2;
 const parts=run.filter(it=>it.kind==='p').map(it=>({p:getPart(it.id),c:(it.t1+it.t2)/2}));
 const isV=TYPES[type].vert;
 const np=mkPart(type,0,0,hor?(isV?1:0):(isV?0:1));
 parts.push({p:np,c:tHit,isNew:true});
 parts.sort((a,b)=>a.c-b.c);
 const U=(B-A)/GRID,n=parts.length,free=U-4*n;
 if(free<n+1){
  st.wires=st.wires; // keep exploded (equivalent connectivity)
  toast(L(`אין מספיק מקום על החוט — האריכו אותו בעוד ${(n+1-free)} משבצות`,`Not enough room on this wire — make it ${(n+1-free)} grid steps longer`));
  return 'short';
 }
 // distribute free units into n+1 gaps (middle gaps get extras first)
 const gaps=new Array(n+1).fill(Math.floor(free/(n+1)));let extra=free-gaps[0]*(n+1);
 const order=[...Array(n+1).keys()].sort((a,b)=>Math.abs(a-n/2)-Math.abs(b-n/2));
 for(let i=0;extra>0;i=(i+1)%(n+1),extra--)gaps[order[i]]++;
 // remove run wires
 const runW=new Set(run.filter(it=>it.kind==='w').map(it=>it.id));
 st.wires=st.wires.filter(w=>!runW.has(w.id));
 const P=t=>hor?[t,fix]:[fix,t];
 let t=A;
 for(let i=0;i<n;i++){
  const g=gaps[i]*GRID;st.wires.push({id:nid('w'),pts:[P(t),P(t+g)]});t+=g;
  const c=t+40,q=parts[i].p;q.x=hor?c:fix;q.y=hor?fix:c;t+=80;

}
function placePart(type,wx,wy,fromTap){
 snapshot();
 // insert into wire?
 let hit=null;
 if(fromTap&&sel&&sel.kind==='wire'){const w=getWire(sel.id);if(w&&TYPES[type].line){
   let bi=-1,bl=-1;for(let i=1;i<w.pts.length;i++){const a=w.pts[i-1],b=w.pts[i];if(a[0]!==b[0]&&a[1]!==b[1])continue;const l=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);if(l>bl){bl=l;bi=i;}}
   if(bi>0){const a=w.pts[bi-1],b=w.pts[bi];hit={w:w.id,i:bi,px:(a[0]+b[0])/2,py:(a[1]+b[1])/2,seg:[a[0],a[1],b[0],b[1]]};}}}

function setMode(m){mode=m;wireStart=null;hoverPt=null;renderOverlay();updateToolbar();}
function wireTap(x,y){

 if(wireStart[0]===x&&wireStart[1]===y){wireStart=null;renderOverlay();updateToolbar();return;}
 const existed=(R?R.net:buildNets(st)).nodeAt(x,y)>=0||st.wires.some(w=>w.pts.some((q,i)=>i>0&&onSegInt(x,y,[w.pts[i-1][0],w.pts[i-1][1],q[0],q[1]])));
 snapshot();st.wires.push({id:nid('w'),pts:route(wireStart,[x,y])});

  drag={type:'pinch',d0:Math.hypot(a.sx-b.sx,a.sy-b.sy)||1,s0:view.s,w0:toWorld(mx,my)};return;}

  const p=getPart(tgt.dataset.part);sel={kind:'part',id:p.id};const [wx,wy]=toWorld(sx,sy);
  drag=Object.assign({type:'move',id:p.id,ox:wx-p.x,oy:wy-p.y,x0:p.x,y0:p.y,pins0:pinsAbs(p),orig:origWires()},base);
  render();if(tab!=='tbl')tab='part';$('side').classList.remove('min');renderSide();return;}

svg.addEventListener('pointermove',e=>{

function endPtr(e){

function linkEnvelope(app,kind,data,opts){

 Object.assign(o,{schema:LINK_SCHEMA,app,kind,title:(opts&&opts.title)||'',data,createdAt:new Date().toISOString()});
 if(opts&&opts.template)o.template=opts.template;if(opts&&opts.notes)o.notes=opts.notes;

function linkUnknownKeys(env){return Object.keys(env).filter(k=>!LINK_KNOWN.includes(k));}

function blockTemplate(){
 if(!R||!R.ok)return {err:L('קודם המעגל צריך להיפתר בלי שגיאות.','The circuit must solve without errors first.')};
 const net=R.net,oas=st.parts.filter(p=>p.type==='OA');if(oas.length!==1)return null;
 const oa=oas[0],[nm,np,no]=net.partNodes[oa.id],pn_=id=>net.partNodes[id];
 const between=(a,b)=>st.parts.filter(p=>p.type==='R'&&((pn_(p.id)[0]===a&&pn_(p.id)[1]===b)||(pn_(p.id)[0]===b&&pn_(p.id)[1]===a)));
 const vsrcAt=n=>st.parts.find(p=>p.type==='V'&&((pn_(p.id)[0]===n&&pn_(p.id)[1]===0)));
 const sym=(p,fb)=>/^[A-Za-z](?:\d+|[a-z]+)?$/.test(p.name)?p.name:fb;
 const A=parseVal(oa.props.A),Av=eng(A,'',3).replace(/\s/g,'');
 const loopNodes=(withK)=>{const nodes=[],edges=[];let k=0;const N=(type,x,y,o)=>{const id=type.toLowerCase()+(++k);nodes.push(Object.assign({id,type,x,y},o||{}));return id;};const E=(a,b,port,sign)=>edges.push({id:'e'+(++k),from:a,to:b,port:port||'in',sign:sign==null?1:sign});return {nodes,edges,N,E};};
 if(no===nm&&vsrcAt(np)){const d=loopNodes();const r=d.N('R',40,120),s=d.N('S',130,120),a=d.N('G',250,120,{name:'A'}),p=d.N('P',350,120),c=d.N('C',430,120);
  d.E(r,s,'W');d.E(s,a);d.E(a,p);d.E(p,c);d.E(p,s,'S',-1);
  return {template:'voltage-follower',data:{nodes:d.nodes,edges:d.edges},notes:{he:`אנלוגיה: עוקב מתח = לולאת משוב יחידה (β = 1). A = ${Av}, ולכן Vout/Vin = A/(1+A) ≈ 1.`,en:`Analogy: a voltage follower is a unity-feedback loop (β = 1). A = ${Av}, so Vout/Vin = A/(1+A) ≈ 1.`}};}
 const rf=between(no,nm)[0];
 if(rf){const r1=between(nm,0)[0],vin=vsrcAt(np);
  if(r1&&vin){const a1=sym(r1,'R1'),af=sym(rf,'Rf');const R1v=parseVal(r1.props.R),Rfv=parseVal(rf.props.R);
   const d=loopNodes();const r=d.N('R',40,120),s=d.N('S',130,120),a=d.N('G',250,120,{name:'A'}),p=d.N('P',350,120),c=d.N('C',430,120),b=d.N('G',250,210,{name:'β',flip:true,expr:`${a1}/(${a1}+${af})`});
   d.E(r,s,'W');d.E(s,a);d.E(a,p);d.E(p,c);d.E(p,b);d.E(b,s,'S',-1);
   const g=1+Rfv/R1v;
   return {template:'non-inverting-amp',data:{nodes:d.nodes,edges:d.edges},notes:{he:`אנלוגיה: מגבר לא מהפך = לולאת משוב שלילי. G = A (${Av}), H = β = ${a1}/(${a1}+${af}). כש-A→∞ ההגבר → 1/β = 1+${af}/${a1} = ${(+g.toPrecision(4))}.`,en:`Analogy: a non-inverting amp is a negative-feedback loop. G = A (${Av}), H = β = ${a1}/(${a1}+${af}). As A→∞ the gain → 1/β = 1+${af}/${a1} = ${(+g.toPrecision(4))}.`}};}
  if(np===0){const vs=st.parts.find(p=>p.type==='V'&&pn_(p.id)[1]===0&&between(pn_(p.id)[0],nm).length);
   if(vs){const rin=between(pn_(vs.id)[0],nm)[0];const ai=sym(rin,'Rin'),af=sym(rf,'Rf');const g=parseVal(rf.props.R)/parseVal(rin.props.R);
    const d=loopNodes();const r=d.N('R',40,120),kk=d.N('G',130,120,{name:'K',expr:`${af}/(${ai}+${af})`}),s=d.N('S',230,120),a=d.N('G',340,120,{name:'A'}),p=d.N('P',440,120),c=d.N('C',510,120),b=d.N('G',340,210,{name:'β',flip:true,expr:`${ai}/(${ai}+${af})`});
    d.E(r,kk);d.E(kk,s,'W',-1);d.E(s,a);d.E(a,p);d.E(p,c);d.E(p,b);d.E(b,s,'S',-1);
    return {template:'inverting-amp',data:{nodes:d.nodes,edges:d.edges},notes:{he:`אנלוגיה: מגבר מהפך. V− = K·Vin + β·Vout, ושני האותות נכנסים למחבר עם −. כש-A→∞ ההגבר → −K/β = −${af}/${ai} = −${(+g.toPrecision(4))}.`,en:`Analogy: inverting amp. V− = K·Vin + β·Vout, both entering the sum with −. As A→∞ the gain → −K/β = −${af}/${ai} = −${(+g.toPrecision(4))}.`}};}}
 }

}

const E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
function e12(v,dir){ // dir: 1 = round up, -1 = round down, 0 nearest
 if(!(v>0))return v;const d=Math.floor(Math.log10(v));let best=null;
 for(let k=d-1;k<=d+1;k++)for(const m of E12){const c=+(m*Math.pow(10,k)).toPrecision(3);
  if(dir>0&&c<v*0.9999)continue;if(dir<0&&c>v*1.0001)continue;
  if(best===null||Math.abs(Math.log(c/v))<Math.abs(Math.log(best/v)))best=c;}
 return best===null?v:best;
}

function routeAll(s,clusters){

  const comp=[s0];seen.add(s0);
  for(let i=0;i<comp.length;i++)for(const e of adj[comp[i]]){const v=e.a===comp[i]?e.b:e.a;if(!seen.has(v)){seen.add(v);comp.push(v);}}
  const root=comp.find(k=>gKeys.has(k))||comp[0];
  const pe={},order=[root],vis=new Set([root]);
  for(let i=0;i<order.length;i++){const u=order[i];for(const e of adj[u]){const v=e.a===u?e.b:e.a;if(!vis.has(v)){vis.add(v);pe[v]=[e,u];order.push(v);}}}
  const sub={};order.forEach(k=>sub[k]=inj[k]||0);
  for(let i=order.length-1;i>0;i--){const v=order[i],[e,u]=pe[v];e.fl=[v,u,sub[v]];sub[u]+=sub[v];}
 }
 const out=[];
 for(const e of edges){if(!e.fl||Math.abs(e.fl[2])<1e-9)continue;const [v,u,I]=e.fl;const a=pts[I>0?v:u],b=pts[I>0?u:v];out.push({s:[a[0],a[1],b[0],b[1]],I:Math.abs(I)});}
 for(const p of st.parts){const pi=R.pinI[p.id]||[],ps=pinsAbs(p);
  if(p.type==='OA'){const io=-(pi[2]||0);if(Math.abs(io)<1e-9)continue;const o=ps[2],c=[p.x+(o[0]-p.x)*0.3,p.y+(o[1]-p.y)*0.3];
   out.push({s:io>0?[c[0],c[1],o[0],o[1]]:[o[0],o[1],c[0],c[1]],I:Math.abs(io),part:1});continue;}
  if(ps.length!==2)continue;const I=pi[0]||0;if(Math.abs(I)<1e-9)continue;
  const [a,b]=I>0?[ps[0],ps[1]]:[ps[1],ps[0]];out.push({s:[a[0],a[1],b[0],b[1]],I:Math.abs(I),part:1});}
 return out;
}
function flowMarkup(){
 let h='<g class="flows">';
 for(const f of computeFlows()){const d=Math.max(0.3,Math.min(3,1.6-0.32*Math.log10(f.I/1e-3)));
  h+=`<line class="flow${f.part?' fp':''}" x1="${f.s[0]}" y1="${f.s[1]}" x2="${f.s[2]}" y2="${f.s[3]}" style="animation-duration:${d.toFixed(2)}s"/>`;}
 return h+'</g>';
}
function togglePlay(){
 running=!running;
 if(running){
  R=solve(st);refreshDiag();
  const bad=DIAG.filter(d=>d.sev!=='info');
  if(bad.length){tab='diag';$('side').classList.remove('min');
   toast(L(`▶ נמצאו ${bad.length} תקלות — הרכיבים הבעייתיים זוהרים באדום. ההסברים בלשונית "תקלות".`,`▶ ${bad.length} fault(s) found — faulty parts glow red. Details in the "Faults" tab.`));}
  else toast(R&&R.ok?L('▶ המעגל תקין — הנקודות מראות את כיוון הזרם (מהירות לפי גודל הזרם)','▶ Circuit OK — dots show current direction (speed ~ magnitude)'):L('אין מה להריץ','Nothing to run'));
 }
 render();renderSide();
}

/* ================= boot ================= */
st=load();const fresh=!st;if(!st)st={parts:[],wires:[]};
if(fresh)st=ex('inv');
applyLang();changed();requestAnimationFrame(fit);
{const env=linkFromHash();if(env){linkClearHash();try{if(env.error)throw 0;importCircuit(env,'hash');}catch(e){toast(L('קישור לא תקין','Invalid link'));}}}
